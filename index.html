<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpaceTime · 16S Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }

    .clock-container {
      width: 100%;
      max-width: 540px;
      aspect-ratio: 1 / 1;
      filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.75));
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .legend {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 1.25rem;
      font-size: 0.85rem;
      color: #94a3b8;
      max-width: 540px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="clock-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
      <defs>
        <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1E293B"/>
          <stop offset="85%" stop-color="#0F172A"/>
          <stop offset="100%" stop-color="#020617"/>
        </radialGradient>

        <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#94A3B8"/>
          <stop offset="50%" stop-color="#334155"/>
          <stop offset="100%" stop-color="#64748B"/>
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.5" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- Bezel & Dial -->
      <circle cx="300" cy="300" r="290" fill="url(#bezelGrad)"/>
      <circle cx="300" cy="300" r="272" fill="url(#dialGrad)" stroke="#475569" stroke-width="2"/>

      <!-- Exact 360° Arcs (0° top = W0 / Wake up at 07:00) -->
      <path d="M 300 68 A 232 232 0 0 1 360 76" fill="none" stroke="#F59E0B" stroke-width="18" stroke-linecap="butt"/>
      <path d="M 360 76 A 232 232 0 0 1 530 270" fill="none" stroke="#10B981" stroke-width="18" stroke-linecap="butt"/>
      <path d="M 530 270 A 232 232 0 0 1 530 330" fill="none" stroke="#EAB308" stroke-width="18" stroke-linecap="butt"/>
      <path d="M 530 330 A 232 232 0 0 1 416 501" fill="none" stroke="#059669" stroke-width="18" stroke-linecap="butt"/>
      <path d="M 416 501 A 232 232 0 0 1 211 514" fill="none" stroke="#06B6D4" stroke-width="18" stroke-linecap="butt"/>
      <path d="M 211 514 A 232 232 0 0 1 136 464" fill="none" stroke="#EC4899" stroke-width="18" stroke-linecap="butt"/>
      <path d="M 136 464 A 232 232 0 0 1 300 68" fill="none" stroke="#6366F1" stroke-width="18" stroke-linecap="butt" opacity="0.85"/>

      <!-- 16 Space Dividers (every 22.5° = 1.5 hours) -->
      <g stroke="#0F172A" stroke-width="2.5">
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(0 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(22.5 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(45 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(67.5 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(90 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(112.5 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(135 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(157.5 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(180 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(202.5 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(225 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(247.5 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(270 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(292.5 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(315 300 300)"/>
        <line x1="300" y1="56" x2="300" y2="80" transform="rotate(337.5 300 300)"/>
      </g>

      <!-- Outer Pulse Ring (0 - 9 pulses per space = 9 min per pulse) -->
      <circle cx="300" cy="300" r="132" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 4"/>
      <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle" dominant-baseline="central">
        <text x="300" y="154">0</text>
        <text x="385" y="182">1</text>
        <text x="439" y="255">2</text>
        <text x="439" y="345">3</text>
        <text x="385" y="418">4</text>
        <text x="300" y="446">5</text>
        <text x="215" y="418">6</text>
        <text x="161" y="345">7</text>
        <text x="161" y="255">8</text>
        <text x="215" y="182">9</text>
      </g>

      <!-- Inner Spark Scale Ring (0 - 9 sparks per pulse = 54s per spark) -->
      <circle cx="300" cy="300" r="88" fill="none" stroke="#4C1D24" stroke-width="1" stroke-dasharray="2 3"/>
      <g font-family="monospace" font-size="8.5" font-weight="700" fill="#FB7185" opacity="0.8" text-anchor="middle" dominant-baseline="central">
        <text x="300" y="202">0</text>
        <text x="358" y="221">1</text>
        <text x="394" y="270">2</text>
        <text x="394" y="330">3</text>
        <text x="358" y="379">4</text>
        <text x="300" y="398">5</text>
        <text x="242" y="379">6</text>
        <text x="206" y="330">7</text>
        <text x="206" y="270">8</text>
        <text x="242" y="221">9</text>
      </g>

      <!-- Anchor Labels -->
      <g font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central">
        <text x="300" y="96" font-size="18" fill="#FCD34D">W0</text>
        <text x="300" y="113" font-size="8.5" fill="#FBBF24">WAKE</text>

        <text x="368" y="106" font-size="19" fill="#6EE7B7">S0</text>
        <text x="373" y="123" font-size="8.5" fill="#34D399">SCHOOL</text>

        <text x="498" y="274" font-size="18" fill="#FDE047">L0</text>
        <text x="492" y="290" font-size="8.5" fill="#EAB308">LUNCH</text>

        <text x="496" y="328" font-size="17" fill="#6EE7B7">S3</text>

        <text x="404" y="476" font-size="19" fill="#67E8F9" filter="url(#glow)">F0</text>
        <text x="396" y="493" font-size="8.5" fill="#22D3EE">FREE</text>

        <text x="312" y="502" font-size="19" fill="#67E8F9">F1</text>
        <text x="312" y="518" font-size="8.5" fill="#22D3EE">LIFE</text>

        <text x="206" y="482" font-size="17" fill="#F9A8D4">D0</text>
        <text x="172" y="454" font-size="17" fill="#F9A8D4">R0</text>

        <text x="148" y="424" font-size="18" fill="#A5B4FC">N0</text>
        <text x="155" y="439" font-size="8.5" fill="#818CF8">NIGHT</text>

        <text x="102" y="220" font-size="20" fill="#818CF8" opacity="0.8">N3</text>
        <text x="104" y="238" font-size="8.5" fill="#6366F1">SLEEP</text>
      </g>

      <!-- Brand Label & Live Status -->
      <text x="300" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2.2">SPACETIME · 16S</text>
      <text id="phase-subtitle" x="300" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#94A3B8" text-anchor="middle">SYNCING...</text>

      <!-- Digital Readout Window (SPACE · PULSE · SPARK) -->
      <rect x="228" y="344" width="144" height="32" rx="6" fill="#020617" stroke="#334155" stroke-width="1.8"/>
      <text id="digital-readout" x="300" y="361" font-family="monospace" font-size="15.5" font-weight="bold" fill="#22D3EE" text-anchor="middle" dominant-baseline="central">-- · - · -</text>

      <!-- Dedicated Spark Display Badge + Progress Bar -->
      <rect x="244" y="381" width="112" height="22" rx="5" fill="#1E1018" stroke="#881337" stroke-width="1.2"/>
      <text id="spark-readout" x="300" y="392.5" font-family="monospace" font-size="9.5" font-weight="bold" fill="#FB7185" text-anchor="middle" dominant-baseline="central">SPARK - / 9</text>
      <rect x="252" y="407" width="96" height="4" rx="2" fill="#1E293B"/>
      <rect id="spark-bar" x="252" y="407" width="0" height="4" rx="2" fill="#F43F5E"/>

      <!-- Space Hand (24h cycle) -->
      <g id="space-hand">
        <polygon id="space-hand-shape" points="300,88 293,300 307,300" fill="#22D3EE" opacity="0.95"/>
        <circle cx="300" cy="112" r="4.5" fill="#020617"/>
      </g>

      <!-- Pulse Hand (10 pulses per space = 90 min per loop) -->
      <g id="pulse-hand">
        <line x1="300" y1="322" x2="300" y2="156" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
        <circle cx="300" cy="156" r="3.5" fill="#38BDF8"/>
      </g>

      <!-- Spark Hand (10 sparks per pulse = 9 min per loop, 1 spark = 54s) -->
      <g id="spark-hand">
        <polygon points="300,202 296.5,308 303.5,308" fill="#F43F5E"/>
        <circle cx="300" cy="208" r="3" fill="#FDA4AF"/>
      </g>

      <!-- Center Pin -->
      <circle cx="300" cy="300" r="11" fill="#E2E8F0" stroke="#0F172A" stroke-width="3"/>
      <circle cx="300" cy="300" r="3.5" fill="#0F172A"/>
    </svg>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:#F59E0B"></span>Wake &amp; Breakfast</div>
    <div class="legend-item"><span class="dot" style="background:#10B981"></span>School</div>
    <div class="legend-item"><span class="dot" style="background:#EAB308"></span>Lunch</div>
    <div class="legend-item"><span class="dot" style="background:#06B6D4"></span>Free &amp; Life</div>
    <div class="legend-item"><span class="dot" style="background:#EC4899"></span>Dinner &amp; Rest</div>
    <div class="legend-item"><span class="dot" style="background:#6366F1"></span>Night</div>
    <div class="legend-item"><span class="dot" style="background:#F43F5E"></span>Spark Hand (54s / spark)</div>
  </div>

  <script>
    (function () {
      const spaceHand = document.getElementById('space-hand');
      const spaceHandShape = document.getElementById('space-hand-shape');
      const pulseHand = document.getElementById('pulse-hand');
      const sparkHand = document.getElementById('spark-hand');
      const readout = document.getElementById('digital-readout');
      const sparkReadout = document.getElementById('spark-readout');
      const sparkBar = document.getElementById('spark-bar');
      const subtitle = document.getElementById('phase-subtitle');

      const phases = [
        { start: 0.0,   end: 0.5,   code: 'W0', name: 'WAKE START',       color: '#F59E0B' },
        { start: 0.5,   end: 1.0,   code: 'B0', name: 'BREAKFAST',        color: '#FBBF24' },
        { start: 1.0,   end: 2.5,   code: 'S0', name: 'SCHOOL · BLOCK 1', color: '#10B981' },
        { start: 2.5,   end: 4.0,   code: 'S1', name: 'SCHOOL · BLOCK 2', color: '#10B981' },
        { start: 4.0,   end: 5.5,   code: 'S2', name: 'SCHOOL · BLOCK 3', color: '#10B981' },
        { start: 5.5,   end: 6.5,   code: 'L0', name: 'LUNCH BREAK',      color: '#EAB308' },
        { start: 6.5,   end: 8.0,   code: 'S3', name: 'SCHOOL · BLOCK 4', color: '#059669' },
        { start: 8.0,   end: 9.5,   code: 'S4', name: 'SCHOOL · BLOCK 5', color: '#059669' },
        { start: 9.5,   end: 10.0,  code: 'S5', name: 'SCHOOL WRAP-UP',   color: '#34D399' },
        { start: 10.0,  end: 11.0,  code: 'F0', name: 'FREE POINT',       color: '#22D3EE' },
        { start: 11.0,  end: 12.5,  code: 'F1', name: 'LIFE & HOBBIES',   color: '#06B6D4' },
        { start: 12.5,  end: 13.5,  code: 'F2', name: 'OPEN TIME',        color: '#06B6D4' },
        { start: 13.5,  end: 14.25, code: 'D0', name: 'DINNER',           color: '#EC4899' },
        { start: 14.25, end: 15.0,  code: 'R0', name: 'WIND DOWN',        color: '#F472B6' },
        { start: 15.0,  end: 16.5,  code: 'N0', name: 'NIGHT REST',       color: '#6366F1' },
        { start: 16.5,  end: 18.0,  code: 'N1', name: 'NIGHT REST',       color: '#6366F1' },
        { start: 18.0,  end: 19.5,  code: 'N2', name: 'DEEP SLEEP',       color: '#6366F1' },
        { start: 19.5,  end: 21.0,  code: 'N3', name: 'DEEP SLEEP',       color: '#6366F1' },
        { start: 21.0,  end: 22.5,  code: 'N4', name: 'RECOVERY',         color: '#818CF8' },
        { start: 22.5,  end: 24.0,  code: 'N5', name: 'MORNING CALM',     color: '#818CF8' }
      ];

      function updateClock() {
        const now = new Date();
        const currentHours = now.getHours() + now.getMinutes() / 60 + (now.getSeconds() + now.getMilliseconds() / 1000) / 3600;
        const hoursSince7 = (currentHours - 7 + 24) % 24;

        // 1. Space Hand (360° in 24h = 15°/h)
        const spaceAngle = hoursSince7 * 15;
        spaceHand.setAttribute('transform', `rotate(${spaceAngle.toFixed(3)} 300 300)`);

        // 2. Pulse Hand (360° in 1.5h / 90 min)
        const spaceProgress = (hoursSince7 % 1.5) / 1.5;
        const pulseAngle = spaceProgress * 360;
        pulseHand.setAttribute('transform', `rotate(${pulseAngle.toFixed(3)} 300 300)`);

        // 3. Spark Hand (360° per pulse = 9 min / 540s; 10 sparks per pulse = 54s per spark)
        const pulseProgress = (spaceProgress * 10) % 1;
        const sparkAngle = pulseProgress * 360;
        sparkHand.setAttribute('transform', `rotate(${sparkAngle.toFixed(3)} 300 300)`);

        // 4. Readouts & Spark Progress Bar
        const currentPulse = Math.floor(spaceProgress * 10);
        const currentSpark = Math.floor(pulseProgress * 10);
        const activePhase = phases.find(p => hoursSince7 >= p.start && hoursSince7 < p.end) || phases[0];

        readout.textContent = `${activePhase.code} · ${currentPulse} · ${currentSpark}`;
        readout.setAttribute('fill', activePhase.color);
        spaceHandShape.setAttribute('fill', activePhase.color);
        subtitle.textContent = activePhase.name;
        subtitle.setAttribute('fill', activePhase.color);

        sparkReadout.textContent = `SPARK ${currentSpark} / 9`;
        sparkBar.setAttribute('width', (pulseProgress * 96).toFixed(1));
      }

      updateClock();
      setInterval(updateClock, 150);
    })();
  </script>
</body>
</html>
